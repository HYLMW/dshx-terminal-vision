# Native terminal composition layered over the official dsh-base bundle.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # 与网页端使用同一个全会话统计投影，供终端状态栏读取。
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: dshx-terminal
      name: 'dshx-terminal/runner'
